name: Aggiorna catalogo

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "Test: numero massimo di opere (lascia vuoto per tutte)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Backup prima del sync
        uses: actions/upload-artifact@v4
        with:
          name: backup-catalogo-${{ github.run_number }}
          path: |
            catalog.json
            cache.json
          retention-days: 90
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Genera catalogo
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          LIMIT: ${{ inputs.limit }}
        run: npm run sync -- ${LIMIT:+--limit=$LIMIT} --maxMinutes=320
      - name: Salva catalogo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json cache.json
          git diff --cached --quiet || (git commit -m "Aggiorna catalogo" && git push)
